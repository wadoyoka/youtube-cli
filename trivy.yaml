# `trivy fs .` がカレントディレクトリのこのファイルを自動で読む。
# ローカル（lefthook）と CI（.github/workflows/ci.yml・trivy-daily.yml）で同じ設定を使うため、
# オプションはコマンドラインではなくここに書く。
scan:
  scanners:
    - vuln    # pnpm-lock.yaml / go.mod / go.sum の既知の脆弱性
    - secret  # API キーや秘密鍵の混入
  skip-dirs:
    - node_modules
    - trash
# trivy は既定で、開発用の依存（devDependencies とその先）の脆弱性を調べない。
# commitlint のように手元や CI で動くものもあるので、開発用の依存も調べる。
pkg:
  include-dev-deps: true
severity:
  - HIGH
  - CRITICAL
exit-code: 1
