# `trivy fs` がカレントディレクトリのこのファイルを自動で読む。
# Google の OAuth クライアントシークレットとリフレッシュトークンの混入を見つける。
rules:
  - id: google-oauth-client-secret
    category: Google
    title: Google OAuth client secret
    severity: CRITICAL
    regex: 'GOCSPX-[0-9A-Za-z_-]{28}'
    keywords:
      - 'GOCSPX-'
  - id: google-oauth-refresh-token
    category: Google
    title: Google OAuth refresh token
    severity: CRITICAL
    regex: '1//0[0-9A-Za-z_-]{40,}'
    keywords:
      - '1//0'
